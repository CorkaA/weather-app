<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
    <link rel="icon" href="public/favicon.ico">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page">
    <main class="app">
        <header class="header">
            <a class="header__logo" href="#" aria-label="На главную">
                <img class="logo" src="public/logo.svg" width="192" height="48" alt="WeatherApp">
            </a>

            <div class="search" id="search-container">
                <input type="text" class="search__input" placeholder="Поиск по городу" id="search-input"
                    aria-label="Поиск по городу">
                <button class="search__btn search__btn--submit" type="button" aria-label="Найти">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <path
                            d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z"
                            stroke="#545454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M20.9999 21L16.6499 16.65" stroke="#545454" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="search__btn search__btn--reset" type="button" aria-label="Очистить" id="clear-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <path
                            d="M4.65041 5.95141C4.2912 5.59221 4.29119 5.00983 4.65039 4.65062C5.00958 4.29141 5.59197 4.2914 5.95118 4.65059L19.3496 18.0485C19.7088 18.4077 19.7088 18.9901 19.3496 19.3493C18.9904 19.7085 18.408 19.7086 18.0488 19.3494L4.65041 5.95141Z"
                            fill="currentColor" stroke="currentColor" stroke-width="0.5" />
                        <path
                            d="M4.65084 19.3496C4.29163 18.9904 4.29161 18.408 4.65081 18.0488L18.0488 4.6504C18.408 4.29119 18.9903 4.29118 19.3496 4.65038C19.7088 5.00957 19.7088 5.59196 19.3496 5.95117L5.95163 19.3496C5.59243 19.7088 5.01005 19.7088 4.65084 19.3496Z"
                            fill="currentColor" stroke="currentColor" stroke-width="0.5" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="app__content">
            <section class="current-weather" aria-labelledby="current-weather-title">
                <div class="current-weather__location">
                    <h1 class="current-weather__city" id="current-weather-title">Москва</h1>
                    <p class="current-weather__date">
                        <time datetime="2024-01-06">Суббота, 06 января</time>
                    </p>
                    <p class="current-weather__time">
                        <time datetime="11:29">11:29</time>
                    </p>
                </div>

                <div class="current-weather__temp" aria-label="Температура минус 7 градусов">-7°</div>

                <div class="current-weather__other">
                    <div class="current-weather__condition">
                        <img class="current-weather__icon" src="public/weather.svg" width="24" height="24" alt="Облачно"
                            aria-hidden="true">
                        <span class="current-weather__desc">Облачно</span>
                    </div>
                    <p class="current-weather__feels-like">Ощущается как -11°</p>
                </div>
            </section>

            <section class="forecast" aria-label="Детали погоды">
                <ul class="forecast__list" id="forecast-list"></ul>
            </section>
        </div>

        <div class="slider" aria-hidden="true">

        </div>

        <footer class="footer">

        </footer>
    </main>

    <script src="js/weather-data.js"></script>
    <script src="js/scripts.js"></script>
</body>

</html>
